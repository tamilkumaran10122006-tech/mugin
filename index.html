<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Login (UI Demo)</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f5fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:340px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    text-align:center;
}

.logo{
    width:90px;
    margin-bottom:15px;
}

h2{
    color:#003366;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#003366;
    color:#fff;
    font-size:16px;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="login-box">

    <!-- Replace with your logo -->
    <img src="logo.png" class="logo" alt="College Logo">

    <h2>College Login</h2>

    <input type="text" placeholder="User ID" disabled>
    <input type="password" placeholder="Password" disabled>

    <button disabled>Login</button>

</div>

</body>
</html>

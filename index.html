<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#004080,#0080ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:360px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    margin-bottom:15px;
}

h2{
    color:#003366;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#004080;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0059b3;
}

.footer{
    margin-top:15px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="login-box">

<img src="logo.png" alt="College Logo" class="logo">

<h2>College Login Portal</h2>

<form>
    <input type="text" placeholder="User ID" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<div class="footer">
    © 2026 College Portal
</div>

</div>

</body>
</html>
